<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markov Harmonic Engine v12</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-bg: #181b20;
            --accent-cyan: #00e5ff;
            --accent-purple: #9d4edd;
            --accent-green: #00ffaa;
            --accent-orange: #ff9100;
            --text-main: #f0f2f5;
            --text-dim: #8c96a6;
            --border: #282c35;
        }

        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 16px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; gap: 16px;
            max-width: 1280px; margin: 0 auto;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border); padding-bottom: 12px;
        }

        h1 { margin: 0; font-size: 1.1rem; color: var(--accent-cyan); }
        .badge {
            background: rgba(0, 229, 255, 0.1); color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan); padding: 4px 10px;
            border-radius: 12px; font-size: 0.75rem; font-weight: 600;
        }

        .layout-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 900px) { .layout-grid { grid-template-columns: 420px 1fr; } }

        .panel {
            background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
        }

        .panel h2 { margin: 0; font-size: 0.82rem; color: var(--accent-green); text-transform: uppercase; letter-spacing: 0.5px; }
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        label { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; }
        input[type="range"] { width: 45%; accent-color: var(--accent-cyan); }
        select, input[type="text"] {
            background: #222630; color: var(--text-main); border: 1px solid var(--border);
            padding: 6px 8px; border-radius: 6px; font-size: 0.82rem;
        }
        input[type="text"] { width: 100%; }
        .val-disp { font-family: monospace; font-size: 0.8rem; color: var(--accent-cyan); width: 45px; text-align: right; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button {
            background: #222630; color: var(--text-main); border: 1px solid var(--border);
            padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 0.82rem;
            cursor: pointer; flex: 1; min-width: 90px; transition: background 0.2s ease;
        }
        button:active { transform: scale(0.97); }
        button.primary { background: var(--accent-cyan); color: #000; border: none; }
        button.playing { background: var(--accent-purple); color: #fff; border: none; box-shadow: 0 0 12px rgba(157, 78, 221, 0.5); }
        button.success { background: #00b894; color: #fff; border: none; }

        .stream-log {
            min-height: 250px; max-height: 480px; background: #08090b; border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.85rem;
            color: var(--accent-cyan); overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }

        .bar-container {
            width: 100%; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border);
            border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
        }
        .bar-title { color: var(--accent-cyan); font-size: 0.75rem; font-weight: bold; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 4px; }
        .bar-content { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

        .note-tag {
            background: #1c222d; border: 1px solid var(--border); padding: 5px 8px;
            border-radius: 6px; font-weight: bold; font-size: 0.78rem; display: inline-flex; flex-direction: column; gap: 2px;
        }
        .note-tag.ai { color: var(--accent-purple); border-color: var(--accent-purple); }
        .note-tag.chord { color: var(--accent-orange); border-color: var(--accent-orange); }
        .note-tag.active-playing { background: var(--accent-cyan); color: #000; }
    </style>
</head>
<body>

    <header>
        <h1>HARMONIC MARKOV ENGINE v12</h1>
        <span class="badge" id="statusBadge">Ready</span>
    </header>

    <div class="layout-grid">
        <div class="panel">
            <h2>1. Chord Progression</h2>
            <div class="control-row">
                <input type="text" id="manualTextInput" value="A, Am, Amaj7, A7, Bm, Bbdim, C#m, D, Dmaj7, Ddim, E, E6, F#m">
            </div>

            <h2>2. Song Structure</h2>
            <div class="control-row">
                <label for="numBars">Bars</label>
                <select id="numBars">
                    <option value="4" selected>4 Bars</option>
                    <option value="8">8 Bars</option>
                    <option value="16">16 Bars</option>
                </select>
            </div>

            <h2>3. Chords & Bass Line</h2>
            <div class="control-row">
                <label for="chordOctave">Chord/Bass Octave</label>
                <select id="chordOctave">
                    <option value="1">Octave 1 (Sub-Bass)</option>
                    <option value="2">Octave 2 (Deep Bass)</option>
                    <option value="3" selected>Octave 3 (Mid-Bass)</option>
                    <option value="4">Octave 4 (Mid Range)</option>
                </select>
            </div>
            <div class="control-row">
                <label for="chordArticulation">Chord Articulation</label>
                <select id="chordArticulation">
                    <option value="legato" selected>Legato (Flowing)</option>
                    <option value="staccato">Staccato (Short)</option>
                    <option value="accent">Accented</option>
                </select>
            </div>

            <h2>4. Restored v9 Harmony Controls</h2>
            <div class="control-row">
                <label for="harmonyMode">Harmony Type</label>
                <select id="harmonyMode">
                    <option value="monophonic">Monophonic Solo Lead</option>
                    <option value="diatonic3rd" selected>In-Key Diatonic 3rds</option>
                    <option value="diatonic5th">In-Key Diatonic 5ths</option>
                    <option value="chordTriad">Chord Triad Lead (3 Voices)</option>
                    <option value="octave">Octave Doubler</option>
                </select>
            </div>
            <div class="control-row">
                <label for="melodyArticulation">Lead Articulation</label>
                <select id="melodyArticulation">
                    <option value="legato" selected>Legato (Connected)</option>
                    <option value="staccato">Staccato (Detached)</option>
                    <option value="accent">Accented</option>
                </select>
            </div>

            <h2>5. Pitch Register & Constraints</h2>
            <div class="control-row">
                <label for="octaveRange">Pitch Range</label>
                <select id="octaveRange">
                    <option value="1">1 Octave</option>
                    <option value="2" selected>2 Octaves</option>
                </select>
            </div>
            <div class="control-row">
                <label for="baseOctave">Base Lead Octave</label>
                <select id="baseOctave">
                    <option value="4" selected>Octave 4 (C4 - C6)</option>
                    <option value="5">Octave 5 (C5 - C7)</option>
                </select>
            </div>
            <div class="control-row">
                <label for="scaleFilter">Allowed Melody Notes</label>
                <select id="scaleFilter">
                    <option value="chordTones" selected>Strict Active Chord Tones Only</option>
                    <option value="diatonic">Full Diatonic Chord Scale</option>
                </select>
            </div>

            <h2>6. Playback & Export</h2>
            <div class="control-row">
                <label for="bpm">BPM</label>
                <input type="range" id="bpm" min="60" max="180" value="100">
                <span class="val-disp" id="bpmVal">100</span>
            </div>

            <div class="btn-group">
                <button id="generateBtn" class="primary">⚡ Generate AI Sequence</button>
            </div>
            <div class="btn-group">
                <button id="playPreviewBtn">▶ Play Preview</button>
                <button id="exportMidiBtn" class="success">💾 Download MIDI</button>
            </div>
        </div>

        <div class="panel">
            <h2>Harmonized Sequence Output</h2>
            <div class="stream-log" id="streamLog">
                <span style="color: var(--text-dim);">Click 'Generate AI Sequence' to output notes...</span>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let activeNodes = [];
        let generatedSequence = [];
        let parsedChords = [];
        let isPreviewPlaying = false;
        let playTimeouts = [];

        const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const CHORD_FORMULAS = {
            "": [0, 4, 7], "M": [0, 4, 7], "MAJ": [0, 4, 7],
            "MIN": [0, 3, 7], "M": [0, 3, 7],
            "7": [0, 4, 7, 10], "MAJ7": [0, 4, 7, 11], "M7": [0, 3, 7, 10],
            "DIM": [0, 3, 6], "°": [0, 3, 6], "DIM7": [0, 3, 6, 9], "6": [0, 4, 7, 9]
        };

        function midiToName(m) { return `${NOTE_NAMES[m % 12]}${Math.floor(m / 12) - 1}`; }
        function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

        function parseChordSymbol(str) {
            let clean = str.trim().replace(/Db/g,'C#').replace(/Eb/g,'D#').replace(/Gb/g,'F#').replace(/Ab/g,'G#').replace(/Bb/g,'A#');
            const match = clean.match(/^([A-G]#?)(.*)$/i);
            if (!match) return null;

            const rootIdx = NOTE_NAMES.indexOf(match[1].toUpperCase());
            if (rootIdx === -1) return null;

            const quality = match[2].toUpperCase();
            const intervals = CHORD_FORMULAS[quality] || CHORD_FORMULAS[""];

            return {
                name: str.trim(),
                rootIdx: rootIdx,
                pitchClasses: intervals.map(i => (rootIdx + i) % 12),
                intervals: intervals
            };
        }

        // Restored v9 scale pitch builder
        function getRegisterScalePitches(chord, minMidi, maxMidi, filterType) {
            let pitches = [];
            for (let m = minMidi; m <= maxMidi; m++) {
                const pc = m % 12;
                if (filterType === 'chordTones') {
                    if (chord.pitchClasses.includes(pc)) pitches.push(m);
                } else {
                    if ([0, 2, 4, 5, 7, 9, 11].includes((pc - chord.rootIdx + 12) % 12)) pitches.push(m);
                }
            }
            return Array.from(new Set(pitches)).sort((a,b) => a - b);
        }

        function generateAISequence() {
            if (isPreviewPlaying) stopPreview();

            const raw = document.getElementById('manualTextInput').value;
            parsedChords = raw.split(',').map(parseChordSymbol).filter(Boolean);
            if (parsedChords.length === 0) return alert("Please enter valid chords.");

            const numBars = parseInt(document.getElementById('numBars').value);
            const harmonyMode = document.getElementById('harmonyMode').value;
            const octaveSpan = parseInt(document.getElementById('octaveRange').value);
            const baseOct = parseInt(document.getElementById('baseOctave').value);
            const chordOct = parseInt(document.getElementById('chordOctave').value);
            const scaleFilter = document.getElementById('scaleFilter').value;
            
            const chordArt = document.getElementById('chordArticulation').value;
            const melArt = document.getElementById('melodyArticulation').value;

            generatedSequence = [];
            const streamLog = document.getElementById('streamLog');
            streamLog.innerHTML = '';

            const minMidi = (baseOct + 1) * 12;
            const maxMidi = minMidi + (octaveSpan * 12);
            let lastLeadPitch = minMidi + 7;

            for (let b = 0; b < numBars; b++) {
                const chord = parsedChords[b % parsedChords.length];
                const barStartStep = b * 8;

                const barBox = document.createElement('div');
                barBox.className = 'bar-container';
                barBox.innerHTML = `<div class="bar-title">BAR ${b + 1}: ${chord.name}</div><div class="bar-content" id="bar-${b}"></div>`;
                streamLog.appendChild(barBox);
                const contentEl = document.getElementById(`bar-${b}`);

                // 1. Accompaniment Chords/Bass (Uses Selected Chord Octave)
                const chordMidis = chord.intervals.map(i => (chordOct + 1) * 12 + ((chord.rootIdx + i) % 12));
                generatedSequence.push({ 
                    type: 'chord', 
                    notes: chordMidis, 
                    step: barStartStep, 
                    durationSteps: 8,
                    articulation: chordArt
                });

                const chordTag = document.createElement('span');
                chordTag.className = 'note-tag chord';
                chordTag.innerText = `Bass/Chord: [${chordMidis.map(midiToName).join(', ')}]`;
                contentEl.appendChild(chordTag);

                // 2. Build In-Key Scale Set for Current Chord (v9 Engine)
                const validPitches = getRegisterScalePitches(chord, minMidi, maxMidi, scaleFilter);

                // 3. Step-Wise Motion & Diatonic Harmonization
                for (let s = 0; s < 8; s += 2) {
                    const sortedByProximity = [...validPitches].sort((a, b) => Math.abs(a - lastLeadPitch) - Math.abs(b - lastLeadPitch));
                    const leadPitch = sortedByProximity[Math.floor(Math.random() * Math.min(2, sortedByProximity.length))];
                    lastLeadPitch = leadPitch;

                    const leadIndex = validPitches.indexOf(leadPitch);
                    let noteStack = [leadPitch];

                    // Exact Restored v9 Contextual Harmonization
                    if (harmonyMode === 'diatonic3rd') {
                        const harmIdx = (leadIndex + 2) < validPitches.length ? leadIndex + 2 : leadIndex - 2;
                        if (harmIdx >= 0 && harmIdx < validPitches.length) noteStack.push(validPitches[harmIdx]);
                    } else if (harmonyMode === 'diatonic5th') {
                        const harmIdx = (leadIndex + 4) < validPitches.length ? leadIndex + 4 : leadIndex - 3;
                        if (harmIdx >= 0 && harmIdx < validPitches.length) noteStack.push(validPitches[harmIdx]);
                    } else if (harmonyMode === 'chordTriad') {
                        const harmIdx1 = (leadIndex + 2) < validPitches.length ? leadIndex + 2 : leadIndex - 2;
                        const harmIdx2 = (leadIndex + 4) < validPitches.length ? leadIndex + 4 : leadIndex - 3;
                        if (harmIdx1 >= 0) noteStack.push(validPitches[harmIdx1]);
                        if (harmIdx2 >= 0) noteStack.push(validPitches[harmIdx2]);
                    } else if (harmonyMode === 'octave') {
                        noteStack.push(leadPitch - 12);
                    }

                    generatedSequence.push({
                        type: 'melody',
                        notes: noteStack,
                        step: barStartStep + s,
                        durationSteps: 2,
                        articulation: melArt
                    });

                    const tag = document.createElement('span');
                    tag.className = 'note-tag ai';
                    tag.innerText = `Lead: [${noteStack.map(midiToName).join(', ')}]`;
                    contentEl.appendChild(tag);
                }
            }

            document.getElementById('statusBadge').innerText = `Generated ${numBars} Bars`;
        }

        // MIDI Exporter
        document.getElementById('exportMidiBtn').addEventListener('click', () => {
            if (generatedSequence.length === 0) return alert("Please generate a sequence first.");

            const bpm = parseInt(document.getElementById('bpm').value);
            const numBars = parseInt(document.getElementById('numBars').value);
            const ticksPerStep = 96;
            const totalSongTicks = numBars * 8 * ticksPerStep;
            const mpqn = Math.round(60000000 / bpm);

            function writeVarLen(val) {
                let buffer = val & 0x7F, bytes = [];
                while ((val >>= 7)) { buffer <<= 8; buffer |= (val & 0x7F) | 0x80; }
                while (true) { bytes.push(buffer & 0xFF); if (buffer & 0x80) buffer >>= 8; else break; }
                return bytes;
            }

            function buildTrack(itemType, chan) {
                let events = [0x00, 0xFF, 0x03, 0x04, 0x54, 0x52, 0x4B, 0x31];
                let currentTick = 0;

                const items = generatedSequence.filter(s => s.type === itemType);

                items.forEach(item => {
                    const startTick = item.step * ticksPerStep;
                    const durTicks = item.durationSteps * ticksPerStep;
                    const deltaON = startTick - currentTick;

                    item.notes.forEach((n, idx) => {
                        events.push(...(idx === 0 ? writeVarLen(deltaON) : [0x00]), 0x90 | chan, n, 88);
                    });
                    item.notes.forEach((n, idx) => {
                        events.push(...(idx === 0 ? writeVarLen(durTicks) : [0x00]), 0x80 | chan, n, 0x00);
                    });

                    currentTick = startTick + durTicks;
                });

                if (currentTick < totalSongTicks) {
                    events.push(...writeVarLen(totalSongTicks - currentTick), 0xFF, 0x2F, 0x00);
                } else {
                    events.push(0x00, 0xFF, 0x2F, 0x00);
                }

                const len = events.length;
                return [0x4D, 0x54, 0x72, 0x6B, (len>>24)&0xFF, (len>>16)&0xFF, (len>>8)&0xFF, len&0xFF, ...events];
            }

            const header = [0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x01, 0x00, 0x03, 0x00, 0xC0];
            const metaTrack = [0x4D, 0x54, 0x72, 0x6B, 0x00, 0x00, 0x00, 0x0B, 0x00, 0xFF, 0x51, 0x03, (mpqn>>16)&0xFF, (mpqn>>8)&0xFF, mpqn&0xFF, 0x00, 0xFF, 0x2F, 0x00];

            const fileBytes = new Uint8Array([
                ...header,
                ...metaTrack,
                ...buildTrack('chord', 0),
                ...buildTrack('melody', 1)
            ]);

            const blob = new Blob([fileBytes], { type: "audio/midi" });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = `markov_v12_${numBars}bars.mid`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function stopPreview() {
            isPreviewPlaying = false;
            playTimeouts.forEach(t => clearTimeout(t));
            playTimeouts = [];
            activeNodes.forEach(n => { try { n.stop(); n.disconnect(); } catch(e){} });
            activeNodes = [];
            document.getElementById('playPreviewBtn').innerText = "▶ Play Preview";
            document.getElementById('playPreviewBtn').classList.remove('playing');
        }

        // Web Audio Synthesizer Preview
        function togglePlayPreview() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPreviewPlaying) {
                stopPreview();
                return;
            }

            if (generatedSequence.length === 0) return alert("Generate sequence first.");

            isPreviewPlaying = true;
            document.getElementById('playPreviewBtn').innerText = "■ Stop Preview";
            document.getElementById('playPreviewBtn').classList.add('playing');

            const bpm = parseInt(document.getElementById('bpm').value);
            const stepSec = (60 / bpm) / 2;
            const startTime = audioCtx.currentTime + 0.05;

            generatedSequence.forEach(item => {
                const noteTime = startTime + (item.step * stepSec);
                let durMult = item.articulation === 'staccato' ? 0.4 : 1.2;
                const durSec = item.durationSteps * stepSec * durMult;

                item.notes.forEach(midi => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = item.type === 'chord' ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(midiToFreq(midi), noteTime);

                    let vol = item.type === 'chord' ? 0.06 : 0.12;
                    if (item.articulation === 'accent') vol *= 1.3;

                    gain.gain.setValueAtTime(0.001, noteTime);
                    gain.gain.linearRampToValueAtTime(vol, noteTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + durSec);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(noteTime);
                    osc.stop(noteTime + durSec);
                    activeNodes.push(osc);
                });
            });
        }

        document.getElementById('generateBtn').addEventListener('click', generateAISequence);
        document.getElementById('playPreviewBtn').addEventListener('click', togglePlayPreview);
        document.getElementById('bpm').addEventListener('input', e => document.getElementById('bpmVal').innerText = e.target.value);
    </script>
</body>
</html>
