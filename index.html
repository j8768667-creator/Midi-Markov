<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markov Harmonic Engine v7 (Diatonic & Chord-Conditioned)</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-bg: #181b20;
            --accent-cyan: #00e5ff;
            --accent-purple: #9d4edd;
            --accent-green: #00ffaa;
            --accent-orange: #ff9100;
            --text-main: #f0f2f5;
            --text-dim: #8c96a6;
            --border: #282c35;
        }

        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 16px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; gap: 16px;
            max-width: 1280px; margin: 0 auto;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border); padding-bottom: 12px;
        }

        h1 { margin: 0; font-size: 1.1rem; color: var(--accent-cyan); }
        .badge {
            background: rgba(0, 229, 255, 0.1); color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan); padding: 4px 10px;
            border-radius: 12px; font-size: 0.75rem; font-weight: 600;
        }

        .layout-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 900px) { .layout-grid { grid-template-columns: 400px 1fr; } }

        .panel {
            background: var(--panel-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
        }

        .panel h2 { margin: 0; font-size: 0.82rem; color: var(--accent-green); text-transform: uppercase; }
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        label { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; }
        input[type="range"] { width: 45%; accent-color: var(--accent-cyan); }
        select, input[type="text"], input[type="number"] {
            background: #222630; color: var(--text-main); border: 1px solid var(--border);
            padding: 6px 8px; border-radius: 6px; font-size: 0.82rem;
        }
        input[type="text"] { width: 100%; }
        input[type="number"] { width: 80px; }
        .val-disp { font-family: monospace; font-size: 0.8rem; color: var(--accent-cyan); width: 45px; text-align: right; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button {
            background: #222630; color: var(--text-main); border: 1px solid var(--border);
            padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 0.82rem;
            cursor: pointer; flex: 1; min-width: 90px;
        }
        button:active { transform: scale(0.97); }
        button.primary { background: var(--accent-cyan); color: #000; border: none; }
        button.playing { background: var(--accent-purple); color: #fff; border: none; box-shadow: 0 0 12px rgba(157, 78, 221, 0.5); }
        button.danger { background: #3a1c24; color: #ff4d6d; border-color: #ff0055; }

        .stream-log {
            min-height: 220px; max-height: 440px; background: #08090b; border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.85rem;
            color: var(--accent-cyan); overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }

        .bar-container {
            width: 100%; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border);
            border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
        }
        .bar-title { color: var(--accent-cyan); font-size: 0.75rem; font-weight: bold; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 4px; }
        .bar-content { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

        .note-tag {
            background: #1c222d; border: 1px solid var(--border); padding: 5px 8px;
            border-radius: 6px; font-weight: bold; font-size: 0.78rem; display: inline-flex; flex-direction: column; gap: 2px;
        }
        .note-tag.ai { color: var(--accent-purple); border-color: var(--accent-purple); }
        .note-tag.chord { color: var(--accent-orange); border-color: var(--accent-orange); }
        .note-tag.active-playing { background: var(--accent-cyan); color: #000; }
    </style>
</head>
<body>

    <header>
        <h1>HARMONIC MARKOV ENGINE v7</h1>
        <span class="badge" id="statusBadge">Awaiting Input</span>
    </header>

    <div class="layout-grid">
        <div class="panel">
            <h2>1. Chord Progression</h2>
            <div class="control-row">
                <input type="text" id="manualTextInput" value="A, Am, Amaj7, A7, Bm, Bbdim, C#m, D, Dmaj7, Ddim, E, E6, F#m">
            </div>
            <div class="btn-group">
                <button id="addManualBtn" class="primary">Train Model</button>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border);">

            <h2>2. Song Structure</h2>
            <div class="control-row">
                <label for="numBars">Bars</label>
                <select id="numBars">
                    <option value="4" selected>4 Bars</option>
                    <option value="8">8 Bars</option>
                    <option value="16">16 Bars</option>
                </select>
            </div>

            <h2>3. Chord & Arp Style</h2>
            <div class="control-row">
                <label for="chordSustainMode">Chord Rhythm</label>
                <select id="chordSustainMode">
                    <option value="full">Sustained Whole Bars</option>
                    <option value="arp" selected>Arpeggiated Pattern</option>
                </select>
            </div>
            <div class="control-row">
                <label for="chordArpPattern">Arp Pattern</label>
                <select id="chordArpPattern">
                    <option value="up" selected>Ascending (Up)</option>
                    <option value="down">Descending (Down)</option>
                    <option value="updown">Up / Down Loop</option>
                </select>
            </div>

            <h2>4. Strict Harmonization Controls</h2>
            <div class="control-row">
                <label for="strictToneMode">Melody Mode</label>
                <select id="strictToneMode">
                    <option value="chordTonesOnly" selected>Strict Chord Tones (100% In-Key)</option>
                    <option value="diatonicPassing">Chord Tones + Diatonic Passing Steps</option>
                </select>
            </div>

            <h2>5. Pitch & Tempo</h2>
            <div class="control-row">
                <label for="chordOctave">Chord Octave</label>
                <select id="chordOctave">
                    <option value="3" selected>Octave 3 (Warm Mid)</option>
                    <option value="4">Octave 4 (High Mid)</option>
                </select>
            </div>
            <div class="control-row">
                <label for="melodyOctave">Melody Octave</label>
                <select id="melodyOctave">
                    <option value="4">Octave 4</option>
                    <option value="5" selected>Octave 5 (Lead)</option>
                </select>
            </div>
            <div class="control-row">
                <label for="bpm">BPM</label>
                <input type="range" id="bpm" min="60" max="180" value="95">
                <span class="val-disp" id="bpmVal">95</span>
            </div>

            <div class="btn-group">
                <button id="generateBtn" class="primary">⚡ Generate AI Sequence</button>
            </div>
            <div class="btn-group">
                <button id="playPreviewBtn">▶ Play Preview</button>
                <button id="exportMidiBtn">Export Multi-Track MIDI</button>
            </div>
        </div>

        <div class="panel">
            <h2>Harmonized Bar Stream</h2>
            <div class="stream-log" id="streamLog">
                <span style="color: var(--text-dim);">Click Generate AI Sequence to begin...</span>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let activeNodes = [];
        let generatedSequence = [];
        let parsedChords = [];
        let isPreviewPlaying = false;
        let playTimeouts = [];

        const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const CHORD_FORMULAS = {
            "": [0, 4, 7], "M": [0, 4, 7], "MAJ": [0, 4, 7],
            "MIN": [0, 3, 7], "M": [0, 3, 7],
            "7": [0, 4, 7, 10], "MAJ7": [0, 4, 7, 11], "M7": [0, 3, 7, 10],
            "DIM": [0, 3, 6], "°": [0, 3, 6], "DIM7": [0, 3, 6, 9], "6": [0, 4, 7, 9]
        };

        function clampMidiPitch(midi, minMidi = 36, maxMidi = 88) {
            while (midi < minMidi) midi += 12;
            while (midi > maxMidi) midi -= 12;
            return midi;
        }

        function parseChordSymbol(str, octave) {
            let clean = str.trim().replace(/Db/g,'C#').replace(/Eb/g,'D#').replace(/Gb/g,'F#').replace(/Ab/g,'G#').replace(/Bb/g,'A#');
            const match = clean.match(/^([A-G]#?)(.*)$/i);
            if (!match) return null;

            const rootIdx = NOTE_NAMES.indexOf(match[1].toUpperCase());
            if (rootIdx === -1) return null;

            const rootMidi = (octave + 1) * 12 + rootIdx;
            const quality = match[2].toUpperCase();
            const intervals = CHORD_FORMULAS[quality] || CHORD_FORMULAS[""];

            return {
                name: str.trim(),
                rootMidi: rootMidi,
                pitchClasses: intervals.map(i => (rootIdx + i) % 12),
                midiNotes: intervals.map(i => clampMidiPitch(rootMidi + i, (octave + 1) * 12, (octave + 2) * 12 + 11))
            };
        }

        function parseInputChords() {
            const raw = document.getElementById('manualTextInput').value;
            const octave = parseInt(document.getElementById('chordOctave').value);
            parsedChords = raw.split(',').map(s => parseChordSymbol(s, octave)).filter(Boolean);
            document.getElementById('statusBadge').innerText = `Loaded ${parsedChords.length} Chords`;
        }

        function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
        function midiToName(m) { return `${NOTE_NAMES[m % 12]}${Math.floor(m / 12) - 1}`; }

        function generateAISequence() {
            if (parsedChords.length === 0) parseInputChords();

            const numBars = parseInt(document.getElementById('numBars').value);
            const melOct = parseInt(document.getElementById('melodyOctave').value);
            const mode = document.getElementById('strictToneMode').value;
            const sustainMode = document.getElementById('chordSustainMode').value;
            const arpPattern = document.getElementById('chordArpPattern').value;

            generatedSequence = [];
            const streamLog = document.getElementById('streamLog');
            streamLog.innerHTML = '';

            const stepsPerBar = 8;
            let lastMelodyNote = null;

            for (let b = 0; b < numBars; b++) {
                const chord = parsedChords[b % parsedChords.length];
                const barStart = b * stepsPerBar;

                const barBox = document.createElement('div');
                barBox.className = 'bar-container';
                barBox.innerHTML = `<div class="bar-title">BAR ${b + 1}: ${chord.name}</div><div class="bar-content" id="bar-${b}"></div>`;
                streamLog.appendChild(barBox);
                const contentEl = document.getElementById(`bar-${b}`);

                // 1. Generate Accompaniment Track
                if (sustainMode === 'full') {
                    generatedSequence.push({ type: 'chord', notes: chord.midiNotes, step: barStart, durationSteps: 8 });
                } else {
                    let arpPitches = [...chord.midiNotes];
                    if (arpPattern === 'down') arpPitches.reverse();

                    for (let s = 0; s < stepsPerBar; s++) {
                        const note = arpPitches[s % arpPitches.length];
                        generatedSequence.push({ type: 'chord', notes: [note], step: barStart + s, durationSteps: 2 });
                    }
                }

                // 2. Generate Conditioned Melody Track (Rule 1 & 2)
                for (let s = 0; s < stepsPerBar; s += 2) {
                    const stepPos = barStart + s;
                    const isStrongBeat = (s % 4 === 0);

                    // Build Candidate Pool for this exact step
                    const minMelMidi = (melOct + 1) * 12;
                    const chordTonePitches = [];
                    for (let m = minMelMidi; m <= minMelMidi + 12; m++) {
                        if (chord.pitchClasses.includes(m % 12)) chordTonePitches.push(m);
                    }

                    let candidatePool = [...chordTonePitches];

                    // If weak beat and passing tones allowed, add neighboring scale steps
                    if (!isStrongBeat && mode === 'diatonicPassing' && lastMelodyNote !== null) {
                        const neighbor1 = lastMelodyNote + 1;
                        const neighbor2 = lastMelodyNote - 1;
                        candidatePool.push(neighbor1, neighbor2);
                    }

                    // Apply Step-Wise Motion Weighting (Rule 3)
                    let selectedNote = candidatePool[0];
                    if (lastMelodyNote !== null) {
                        candidatePool.sort((a, b) => Math.abs(a - lastMelodyNote) - Math.abs(b - lastMelodyNote));
                        selectedNote = candidatePool[0]; // Select closest pitch to ensure smooth motion
                    }

                    lastMelodyNote = selectedNote;

                    generatedSequence.push({
                        type: 'melody',
                        notes: [selectedNote],
                        step: stepPos,
                        durationSteps: 2
                    });

                    // UI Tag Rendering
                    const tag = document.createElement('span');
                    tag.className = 'note-tag ai';
                    tag.innerText = `Melody: ${midiToName(selectedNote)}`;
                    contentEl.appendChild(tag);
                }
            }

            document.getElementById('statusBadge').innerText = `Generated ${numBars} Bars (Harmonized)`;
        }

        // Precision Hardware Web Audio Playback
        function togglePlayPreview() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPreviewPlaying) {
                isPreviewPlaying = false;
                playTimeouts.forEach(t => clearTimeout(t));
                activeNodes.forEach(n => { try { n.stop(); } catch(e){} });
                document.getElementById('playPreviewBtn').innerText = "▶ Play Preview";
                document.getElementById('playPreviewBtn').classList.remove('playing');
                return;
            }

            if (generatedSequence.length === 0) return alert("Generate sequence first.");

            isPreviewPlaying = true;
            document.getElementById('playPreviewBtn').innerText = "■ Stop Preview";
            document.getElementById('playPreviewBtn').classList.add('playing');

            const bpm = parseInt(document.getElementById('bpm').value);
            const stepSec = (60 / bpm) / 2;
            const startTime = audioCtx.currentTime + 0.05;

            generatedSequence.forEach(item => {
                const noteTime = startTime + (item.step * stepSec);
                const durSec = item.durationSteps * stepSec * 1.5; // Legato ring out

                item.notes.forEach(midi => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = item.type === 'chord' ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(midiToFreq(midi), noteTime);

                    const vol = item.type === 'chord' ? 0.08 : 0.15;
                    gain.gain.setValueAtTime(0.001, noteTime);
                    gain.gain.linearRampToValueAtTime(vol, noteTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + durSec);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(noteTime);
                    osc.stop(noteTime + durSec);
                    activeNodes.push(osc);
                });
            });
        }

        // Strict Bar Alignment Multi-Track MIDI Exporter
        document.getElementById('exportMidiBtn').addEventListener('click', () => {
            if (generatedSequence.length === 0) return alert("Generate sequence first.");

            const bpm = parseInt(document.getElementById('bpm').value);
            const numBars = parseInt(document.getElementById('numBars').value);
            const totalSteps = numBars * 8;

            const ticksPerStep = 96;
            const totalSongTicks = totalSteps * ticksPerStep;
            const mpqn = Math.round(60000000 / bpm);

            function writeVarLen(val) {
                let buffer = val & 0x7F, bytes = [];
                while ((val >>= 7)) { buffer <<= 8; buffer |= (val & 0x7F) | 0x80; }
                while (true) { bytes.push(buffer & 0xFF); if (buffer & 0x80) buffer >>= 8; else break; }
                return bytes;
            }

            function makeTrack(itemType, chan) {
                let events = [0x00, 0xFF, 0x03, 0x05, 0x54, 0x72, 0x61, 0x63, 0x6B];
                let currentTick = 0;

                const items = generatedSequence.filter(s => s.type === itemType).sort((a,b)=>a.step-b.step);

                items.forEach(item => {
                    const startTick = item.step * ticksPerStep;
                    const durTicks = item.durationSteps * ticksPerStep;
                    const deltaON = startTick - currentTick;

                    item.notes.forEach((n, idx) => {
                        events.push(...(idx === 0 ? writeVarLen(deltaON) : [0x00]), 0x90 | chan, n, 88);
                    });
                    item.notes.forEach((n, idx) => {
                        events.push(...(idx === 0 ? writeVarLen(durTicks) : [0x00]), 0x80 | chan, n, 0x00);
                    });

                    currentTick = startTick + durTicks;
                });

                // Enforce exact bar alignment termination
                if (currentTick < totalSongTicks) {
                    events.push(...writeVarLen(totalSongTicks - currentTick), 0xFF, 0x2F, 0x00);
                } else {
                    events.push(0x00, 0xFF, 0x2F, 0x00);
                }

                const len = events.length;
                return [0x4D, 0x54, 0x72, 0x6B, (len>>24)&0xFF, (len>>16)&0xFF, (len>>8)&0xFF, len&0xFF, ...events];
            }

            const header = [0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x01, 0x00, 0x03, 0x00, 0xC0];
            const metaTrack = [0x4D, 0x54, 0x72, 0x6B, 0x00, 0x00, 0x00, 0x0B, 0x00, 0xFF, 0x51, 0x03, (mpqn>>16)&0xFF, (mpqn>>8)&0xFF, mpqn&0xFF, 0x00, 0xFF, 0x2F, 0x00];

            const fileBytes = new Uint8Array([
                ...header,
                ...metaTrack,
                ...makeTrack('chord', 0),
                ...makeTrack('melody', 1)
            ]);

            const blob = new Blob([fileBytes], { type: "audio/midi" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `markov_harmonized_${numBars}bars.mid`;
            document.body.appendChild(a); a.click(); a.remove();
        });

        document.getElementById('addManualBtn').addEventListener('click', parseInputChords);
        document.getElementById('generateBtn').addEventListener('click', generateAISequence);
        document.getElementById('playPreviewBtn').addEventListener('click', togglePlayPreview);
        document.getElementById('bpm').addEventListener('input', e => document.getElementById('bpmVal').innerText = e.target.value);
    </script>
</body>
</html>
